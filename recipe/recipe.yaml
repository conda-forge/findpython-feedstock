schema_version: 1

context:
  name: findpython
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/findpython-${{ version }}.tar.gz
  sha256: 497c6b5eb13734be2542dfb6a93267946339601cbc2f1138c8cd4d40311fefe5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - findpython = findpython.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - pdm-backend
  run:
    - packaging >=20
    - python >=${{ python_min }}
    - platformdirs >=4.3.6

tests:
  - python:
      imports:
        - findpython
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: A utility to find python versions on your system
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/findpython/
  repository: https://github.com/frostming/findpython

extra:
  recipe-maintainers:
    - xhochy
